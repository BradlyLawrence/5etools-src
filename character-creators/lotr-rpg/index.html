<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>Lord of the Rings Roleplaying — Character Creator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="icon" type="image/png" href="../favicon.png">
	<link rel="stylesheet" href="../shared/styles.css?v=3.2">
	<link rel="stylesheet" href="../dnd-2024/app.css?v=3.2">
	<link rel="stylesheet" href="app.css?v=3.2">
</head>
<body>
	<div class="cc-page cc-app-page">
		<header class="cc-header cc-lotr-header">
			<div>
				<h1>Lord of the Rings Roleplaying</h1>
				<p class="cc-sub">Free League · 5e-compatible · cultures, callings, virtues · JSON save/load · PDF</p>
			</div>
			<p class="cc-muted">
				<a href="../">← Creators</a>
				·
				<a href="../../index.html">5etools</a>
				·
				<a href="../../managebrew.html">Homebrew</a>
			</p>
		</header>

		<p id="status" class="cc-status">Starting…</p>
		<div id="app"></div>
	</div>

	<script src="../dnd-2024/lib/html2canvas.min.js"></script>
	<script src="../dnd-2024/lib/jspdf.umd.min.js"></script>
	<script type="module">
		const t = Date.now();
		document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
			const u = new URL(link.href, location.href);
			u.searchParams.set("t", t);
			link.href = u.toString();
		});
		import(`./js/main.js?t=${t}`).catch(err => {
			console.error("Failed to load application:", err);
			const st = document.getElementById("status");
			if (st) st.textContent = `Error loading app: ${err.message}`;
		});
	</script>
</body>
</html>
